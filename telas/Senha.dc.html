<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meu Corre · Senha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Figtree:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC629}a:hover{color:#FFD866}
input::placeholder{color:#7E8696}
input:focus{outline:2px solid #FFC629;outline-offset:2px}
.cta:focus-visible,.volta:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
/* Entrada: cabeçalho desce, blocos sobem em sequência, a faixa corre e o botão sobe */
.mc-on .mc-topo{animation:mc-desce .5s cubic-bezier(.2,.75,.25,1) both}
.mc-on .mc-cascata > *{animation:mc-bloco .55s cubic-bezier(.2,.75,.25,1) both}
.mc-on .mc-cascata > :nth-child(1){animation-delay:0.06s}
.mc-on .mc-cascata > :nth-child(2){animation-delay:0.13s}
.mc-on .mc-cascata > :nth-child(3){animation-delay:0.20s}
.mc-on .mc-cascata > :nth-child(4){animation-delay:0.27s}
.mc-on .mc-cascata > :nth-child(5){animation-delay:0.34s}
.mc-on .mc-estrada{animation:mc-estrada 1.1s cubic-bezier(.2,.6,.3,1) .2s both}
.mc-on .mc-rodape{animation:mc-bloco .55s cubic-bezier(.2,.75,.25,1) .4s both}
@keyframes mc-desce{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes mc-bloco{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes mc-estrada{from{background-position:-180px 0}to{background-position:0 0}}
</style>
</helmet>
<div class="{{classeAnim}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #1A1E26; color: #EEF0F3; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div class="mc-topo" style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 12px">
    <a class="volta" href="Main.dc.html" aria-label="Voltar para o login" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #3A414D; color: #EEF0F3; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <svg viewBox="0 0 64 64" width="36" height="36" role="img" aria-label="Meu Corre">
      <path d="M13 53 C13 40 22 37 30 33 C39 28.5 41 19 51 13" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"></path>
      <path d="M13 53 C13 40 22 37 30 33 C39 28.5 41 19 51 13" fill="none" stroke="#1A1E26" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4.2 4.6"></path>
      <circle cx="51" cy="13" r="8.5" fill="#FFC629"></circle>
      <circle cx="51" cy="13" r="3.2" fill="#1A1E26"></circle>
    </svg>
  </div>

  <div class="mc-cascata" style="display: flex; flex-direction: column; gap: 18px; padding: 20px 28px 0; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Archivo', 'Arial Black', sans-serif; font-stretch: 112%; font-weight: 900; font-size: 32px; line-height: 1.05; color: #FFFFFF">{{titulo}}</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #C9CED7">{{subtitulo}}</p>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; background: #262B35; border-radius: 16px">
      <span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: #FFC629; color: #1A1E26; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 900; font-size: 17px">{{inicial}}</span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
        <span style="font-size: 12.5px; color: #9AA2B1">{{rotuloEmail}}</span>
        <span style="font-family: 'DM Mono', monospace; font-size: 15px; color: #FFFFFF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{email}}</span>
      </div>
      <a href="Main.dc.html" style="flex-shrink: 0; display: flex; align-items: center; height: 44px; padding: 0 10px; font-weight: 700; font-size: 14px; text-decoration: none">Trocar</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="senha" style="font-size: 14px; font-weight: 600; color: #EEF0F3">{{rotuloSenha}}</label>
      <div style="position: relative">
        <input id="senha" type="{{tipoSenha}}" autocomplete="{{autocompleteSenha}}" value="{{senha}}" onChange="{{on_senha}}" aria-invalid="{{temErro}}" aria-describedby="senha-dica" style="height: 52px; width: 100%; box-sizing: border-box; padding: 0 56px 0 16px; border-radius: 14px; border: 1px solid {{bordaSenha}}; background: #1A1E26; color: #FFFFFF; font-family: 'DM Mono', monospace; font-size: 17px">
        <button type="button" onClick="{{alternarVer}}" aria-label="{{verRotulo}}" aria-pressed="{{vendo}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #C9CED7; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <sc-if value="{{escondida}}" hint-placeholder-val="{{ true }}">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </sc-if>
          <sc-if value="{{vendo}}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"></path></svg>
          </sc-if>
        </button>
      </div>
      <sc-if value="{{temErro}}" hint-placeholder-val="{{ false }}">
        <span role="alert" style="font-size: 13px; font-weight: 600; color: #FF7A7E">{{erro}}</span>
      </sc-if>
      <span id="senha-dica" style="font-size: 13px; color: #9AA2B1">{{dicaSenha}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-if value="{{podeEsquecer}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{esqueci}}" style="align-self: flex-start; height: 44px; padding: 0; border: 0; background: transparent; color: #FFC629; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">Esqueci minha senha</button>
      </sc-if>
      <sc-if value="{{temAviso}}" hint-placeholder-val="{{ false }}">
        <p role="status" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #262B35; font-size: 13.5px; line-height: 1.45; color: #C9CED7">{{aviso}}</p>
      </sc-if>
    </div>
  </div>

  <div class="mc-estrada" aria-hidden="true" style="height: 6px; margin: 0 0 20px; background: repeating-linear-gradient(90deg, #FFC629 0 36px, transparent 36px 72px)"></div>

  <div class="mc-rodape" style="display: flex; flex-direction: column; gap: 12px; padding: 0 28px 40px">
    <a class="cta" href="Dashboard.dc.html" onClick="{{entrar}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #FFC629; color: #1A1E26; font-weight: 700; font-size: 17px; text-decoration: none">
      {{textoBotao}}
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #9AA2B1; text-align: center">Ao continuar, você aceita os <a href="#termos">Termos de uso</a> e a <a href="#privacidade">Política de privacidade</a>.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = Object.assign({ anim: true, senha: '', ver: false, erro: '', aviso: '' }, this.carregarLogin());

  // O login guarda o e-mail digitado e o modo (entrar ou criar conta). A senha nunca é guardada.
  carregarLogin() {
    var email = '', modo = 'entrar';
    try {
      var l = JSON.parse(window.localStorage.getItem('meucorre.login') || 'null');
      if (l && typeof l === 'object') { email = l.email || ''; if (l.modo === 'criar') modo = 'criar'; }
    } catch (e) {}
    return { email: email || 'voce@email.com', modo: modo };
  }

  on_senha = (e) => { this.setState({ senha: e.target.value, erro: '' }); };
  alternarVer = () => { this.setState({ ver: !this.state.ver }); };
  esqueci = () => { this.setState({ aviso: 'Mandamos um link para criar uma senha nova em ' + this.state.email + '. Confira a caixa de entrada e o spam.' }); };
  entrar = (e) => {
    var st = this.state, s = st.senha || '';
    var erro = !s ? 'Digite sua senha para continuar.' : (st.modo === 'criar' && s.length < 8 ? 'A senha precisa ter pelo menos 8 caracteres.' : '');
    if (erro) { e.preventDefault(); this.setState({ erro: erro }); return; }
    try {
      window.localStorage.setItem('meucorre.login', JSON.stringify({ email: st.email, modo: st.modo, entrou: true }));
      var p = JSON.parse(window.localStorage.getItem('meucorre.perfil') || 'null');
      if (!p || typeof p !== 'object') p = {};
      if (!p.email) { p.email = st.email; window.localStorage.setItem('meucorre.perfil', JSON.stringify(p)); }
    } catch (err) {}
  };

  // Toca a animação sempre que a tela aparece: ao abrir (Play), ao voltar a ficar visível
  // ou quando o tamanho da janela muda (tela cheia). Tirar e pôr a classe reinicia o CSS.
  observarTela() {
    var self = this;
    this.ultimoToque = Date.now();
    this.aoVer = function () { if (document.visibilityState === 'visible') self.tocar(); };
    document.addEventListener('visibilitychange', this.aoVer);
    var tam = window.innerWidth + 'x' + window.innerHeight;
    this.aoRedimensionar = function () {
      clearTimeout(self.esperaTam);
      self.esperaTam = setTimeout(function () {
        var t = window.innerWidth + 'x' + window.innerHeight;
        if (t !== tam) { tam = t; self.tocar(); }
      }, 200);
    };
    window.addEventListener('resize', this.aoRedimensionar);
    if (window.IntersectionObserver && document.body) {
      var visivel = true;
      this.io = new IntersectionObserver(function (es) {
        var v = es[es.length - 1].isIntersecting;
        if (v && !visivel) self.tocar();
        visivel = v;
      });
      this.io.observe(document.body);
    }
  }
  pararDeObservar() {
    document.removeEventListener('visibilitychange', this.aoVer);
    window.removeEventListener('resize', this.aoRedimensionar);
    clearTimeout(this.esperaTam);
    if (this.io) this.io.disconnect();
  }
  tocar = () => {
    var agora = Date.now(), self = this;
    if (agora - (this.ultimoToque || 0) < 1500) return;
    this.ultimoToque = agora;
    this.setState(Object.assign({ anim: false }, this.carregarLogin()));
    requestAnimationFrame(function () { requestAnimationFrame(function () { self.setState({ anim: true }); }); });
  };

  componentDidMount() { this.observarTela(); }
  componentWillUnmount() { this.pararDeObservar(); }

  renderVals() {
    var st = this.state, criar = st.modo === 'criar';
    return {
      classeAnim: st.anim ? 'mc-on' : '',
      titulo: criar ? 'Crie sua senha' : 'Digite sua senha',
      subtitulo: criar ? 'Falta pouco. Escolha uma senha para proteger suas contas.' : 'Bom te ver de volta. Confirme que é você.',
      rotuloEmail: criar ? 'Criando conta com' : 'Entrando como',
      email: st.email,
      inicial: st.email.charAt(0).toUpperCase(),
      rotuloSenha: criar ? 'Nova senha' : 'Senha',
      senha: st.senha,
      on_senha: this.on_senha,
      tipoSenha: st.ver ? 'text' : 'password',
      autocompleteSenha: criar ? 'new-password' : 'current-password',
      vendo: st.ver,
      escondida: !st.ver,
      verRotulo: st.ver ? 'Esconder senha' : 'Mostrar senha',
      alternarVer: this.alternarVer,
      temErro: !!st.erro,
      erro: st.erro,
      bordaSenha: st.erro ? '#FF7A7E' : '#3A414D',
      dicaSenha: criar ? 'Pelo menos 8 caracteres. Misture letras e números.' : 'É a senha que você criou no cadastro.',
      podeEsquecer: !criar,
      esqueci: this.esqueci,
      temAviso: !!st.aviso && !criar,
      aviso: st.aviso,
      textoBotao: criar ? 'Criar conta' : 'Entrar',
      entrar: this.entrar
    };
  }
}
</script>
</body>
</html>
