<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meu Corre · Entrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Figtree:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC629}a:hover{color:#FFD866}
input::placeholder{color:#7E8696}
input:focus{outline:2px solid #FFC629;outline-offset:2px}
.cta:focus-visible,.ghost:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
.mc-etapa{animation:mc-sobe .35s cubic-bezier(.2,.7,.3,1) both}
/* Abertura: a rota sobe no centro da tela, o pino acende, o nome aparece e tudo desliza para o lugar do login */
.mc-on .mc-hero{transform-origin:0 0;animation:mc-hero 2.7s both}
.mc-on .mc-rua{stroke-dasharray:100 100;animation:mc-rua .85s cubic-bezier(.55,0,.25,1) .15s both}
.mc-on .mc-faixa{animation:mc-faixa 1.3s cubic-bezier(.2,.6,.3,1) .55s both}
.mc-on .mc-pino{transform-box:fill-box;transform-origin:center;animation:mc-pino .5s cubic-bezier(.3,1.6,.5,1) .9s both}
.mc-on .mc-pino-miolo{transform-box:fill-box;transform-origin:center;animation:mc-pino .35s cubic-bezier(.3,1.6,.5,1) 1.15s both}
.mc-on .mc-meu{animation:mc-sobe .45s cubic-bezier(.2,.7,.3,1) 1.25s both}
.mc-on .mc-corre{animation:mc-sobe .5s cubic-bezier(.2,.7,.3,1) 1.4s both}
.mc-on .mc-frase{animation:mc-sobe .5s cubic-bezier(.2,.7,.3,1) 2.55s both}
.mc-on .mc-trilha{transform-origin:0 50%;animation:mc-trilha .6s cubic-bezier(.3,.7,.3,1) 2.6s both}
.mc-on .mc-form{animation:mc-form .6s cubic-bezier(.2,.8,.25,1) 2.45s both}
@keyframes mc-hero{
  0%,68%{transform:translate(calc(167px - 75%),calc(330px - 75%)) scale(1.5);animation-timing-function:cubic-bezier(.65,0,.3,1)}
  100%{transform:translate(0,0) scale(1)}
}
@keyframes mc-rua{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes mc-faixa{from{opacity:0;stroke-dashoffset:26.4}20%{opacity:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes mc-pino{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes mc-sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mc-trilha{from{transform:scaleX(0)}to{transform:none}}
@keyframes mc-form{from{transform:translateY(105%)}to{transform:none}}
</style>
</helmet>
<div class="{{classeAnim}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #1A1E26; color: #EEF0F3; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 88px 28px 0; flex-grow: 1; position: relative; z-index: 2">
    <div class="mc-hero" style="display: flex; flex-direction: column; gap: 28px; align-self: flex-start">
      <svg viewBox="0 0 64 64" width="72" height="72" role="img" aria-label="Símbolo Meu Corre" style="overflow: visible">
        <path class="mc-rua" pathLength="100" d="M13 53 C13 40 22 37 30 33 C39 28.5 41 19 51 13" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"></path>
        <path class="mc-faixa" d="M13 53 C13 40 22 37 30 33 C39 28.5 41 19 51 13" fill="none" stroke="#1A1E26" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4.2 4.6"></path>
        <circle class="mc-pino" cx="51" cy="13" r="8.5" fill="#FFC629"></circle>
        <circle class="mc-pino-miolo" cx="51" cy="13" r="3.2" fill="#1A1E26"></circle>
      </svg>
      <div style="font-family: 'Archivo', 'Arial Black', sans-serif; font-stretch: 125%; font-weight: 900; font-size: 52px; line-height: 0.9; letter-spacing: -1px; color: #FFFFFF"><span class="mc-meu" style="display: block; font-weight: 500; font-stretch: 112%; font-size: 22px; letter-spacing: 0; color: #FFC629; margin-bottom: 4px">meu</span><span class="mc-corre" style="display: block">corre</span></div>
    </div>
    <div>
      <p class="mc-frase" style="margin: 0; font-size: 18px; line-height: 1.4; color: #C9CED7; max-width: 300px"><strong style="color: #FFFFFF; font-weight: 700">Seu corre, suas contas.</strong> Veja quanto sobra de verdade depois da gasolina e da taxa do app.</p>
    </div>
  </div>

  <div class="mc-trilha" aria-hidden="true" style="height: 6px; margin: 0 0 28px; background: repeating-linear-gradient(90deg, #FFC629 0 36px, transparent 36px 72px)"></div>

  <div class="mc-form" style="display: flex; flex-direction: column; gap: 12px; padding: 24px 28px 32px; background: #262B35; border-radius: 28px 28px 0 0">
    <sc-if value="{{noInicio}}" hint-placeholder-val="{{ true }}">
      <div class="mc-etapa" style="display: flex; flex-direction: column; gap: 12px">
        <button class="ghost" type="button" onClick="{{google}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; box-sizing: border-box; border-radius: 16px; border: 0; background: #FFFFFF; color: #1F1F1F; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
          Entrar com Google
        </button>

        <button class="cta" type="button" onClick="{{comEmail}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; border: 0; background: #FFC629; color: #1A1E26; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          Entrar com e-mail
        </button>

        <sc-if value="{{temAviso}}" hint-placeholder-val="{{ false }}">
          <p role="status" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #1A1E26; font-size: 13.5px; line-height: 1.45; color: #C9CED7">{{aviso}}</p>
        </sc-if>

        <p style="margin: 2px 0 0; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; font-size: 15px; color: #C9CED7">Não tem conta?<button type="button" onClick="{{criarConta}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #FFC629; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">Criar sua conta</button></p>
      </div>
    </sc-if>

    <sc-if value="{{noEmail}}" hint-placeholder-val="{{ false }}">
      <div class="mc-etapa" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <button type="button" aria-label="Voltar" onClick="{{voltar}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; border: 1px solid #3A414D; background: transparent; color: #EEF0F3; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
          </button>
          <h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 800; font-size: 20px; color: #FFFFFF">{{tituloEmail}}</h2>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="email" style="font-size: 14px; font-weight: 600; color: #EEF0F3">Seu e-mail</label>
          <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" value="{{email}}" onChange="{{on_email}}" aria-invalid="{{temErro}}" aria-describedby="email-dica" placeholder="voce@email.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid {{bordaEmail}}; background: #1A1E26; color: #FFFFFF; font-family: 'DM Mono', monospace; font-size: 16px; width: 100%">
          <sc-if value="{{temErro}}" hint-placeholder-val="{{ false }}">
            <span role="alert" style="font-size: 13px; font-weight: 600; color: #FF7A7E">{{erro}}</span>
          </sc-if>
          <span id="email-dica" style="font-size: 13px; color: #9AA2B1">{{dicaEmail}}</span>
        </div>

        <a class="cta" href="Senha.dc.html" onClick="{{continuar}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #FFC629; color: #1A1E26; font-weight: 700; font-size: 17px; text-decoration: none">
          Continuar
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>

        <p style="margin: 2px 0 0; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; font-size: 15px; color: #C9CED7">{{trocaTexto}}<button type="button" onClick="{{trocarModo}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #FFC629; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">{{trocaAcao}}</button></p>
      </div>
    </sc-if>

    <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #9AA2B1; text-align: center">Ao continuar, você aceita os <a href="#termos">Termos de uso</a> e a <a href="#privacidade">Política de privacidade</a>.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = Object.assign({ anim: true, etapa: 'inicio', erro: '', aviso: '' }, this.carregarLogin());

  // E-mail e modo (entrar ou criar conta) vão para a tela de senha pelo localStorage.
  carregarLogin() {
    var email = '', modo = 'entrar';
    try {
      var l = JSON.parse(window.localStorage.getItem('meucorre.login') || 'null');
      if (l && typeof l === 'object') { email = l.email || ''; if (l.modo === 'criar') modo = 'criar'; }
      if (!email) {
        var p = JSON.parse(window.localStorage.getItem('meucorre.perfil') || 'null');
        if (p && p.email) email = p.email;
      }
    } catch (e) {}
    return { email: email, modo: modo };
  }
  emailValido(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  google = () => { this.setState({ aviso: 'Entrar com Google chega em breve. Por enquanto, entre com seu e-mail.' }); };
  comEmail = () => { this.setState({ etapa: 'email', modo: 'entrar', erro: '', aviso: '' }); };
  criarConta = () => { this.setState({ etapa: 'email', modo: 'criar', erro: '', aviso: '' }); };
  voltar = () => { this.setState({ etapa: 'inicio', erro: '' }); };
  trocarModo = () => { this.setState({ modo: this.state.modo === 'criar' ? 'entrar' : 'criar', erro: '' }); };
  on_email = (e) => { this.setState({ email: e.target.value, erro: '' }); };
  continuar = (e) => {
    var email = (this.state.email || '').trim().toLowerCase();
    if (!this.emailValido(email)) {
      e.preventDefault();
      this.setState({ erro: email ? 'Esse e-mail parece incompleto. Confira e tente de novo.' : 'Digite seu e-mail para continuar.' });
      return;
    }
    try { window.localStorage.setItem('meucorre.login', JSON.stringify({ email: email, modo: this.state.modo })); } catch (err) {}
  };

  // Toca a animação sempre que a tela aparece: ao abrir (Play), ao voltar a ficar visível
  // ou quando o tamanho da janela muda (tela cheia). Tirar e pôr a classe reinicia o CSS.
  observarTela() {
    var self = this;
    this.ultimoToque = Date.now();
    this.aoVer = function () { if (document.visibilityState === 'visible') self.tocar(); };
    document.addEventListener('visibilitychange', this.aoVer);
    var tam = window.innerWidth + 'x' + window.innerHeight;
    this.aoRedimensionar = function () {
      clearTimeout(self.esperaTam);
      self.esperaTam = setTimeout(function () {
        var t = window.innerWidth + 'x' + window.innerHeight;
        if (t !== tam) { tam = t; self.tocar(); }
      }, 200);
    };
    window.addEventListener('resize', this.aoRedimensionar);
    if (window.IntersectionObserver && document.body) {
      var visivel = true;
      this.io = new IntersectionObserver(function (es) {
        var v = es[es.length - 1].isIntersecting;
        if (v && !visivel) self.tocar();
        visivel = v;
      });
      this.io.observe(document.body);
    }
  }
  pararDeObservar() {
    document.removeEventListener('visibilitychange', this.aoVer);
    window.removeEventListener('resize', this.aoRedimensionar);
    clearTimeout(this.esperaTam);
    if (this.io) this.io.disconnect();
  }
  tocar = () => {
    var agora = Date.now(), self = this;
    if (agora - (this.ultimoToque || 0) < 1500) return;
    this.ultimoToque = agora;
    this.setState({ anim: false });
    requestAnimationFrame(function () { requestAnimationFrame(function () { self.setState({ anim: true }); self.aoTocar && self.aoTocar(); }); });
  };

  componentDidMount() { this.observarTela(); }
  componentWillUnmount() { this.pararDeObservar(); }

  renderVals() {
    var st = this.state, criar = st.modo === 'criar';
    return {
      classeAnim: st.anim ? 'mc-on' : '',
      noInicio: st.etapa === 'inicio',
      noEmail: st.etapa === 'email',
      temAviso: !!st.aviso,
      aviso: st.aviso,
      tituloEmail: criar ? 'Criar sua conta' : 'Entrar com e-mail',
      dicaEmail: criar ? 'Use um e-mail que você abre sempre. Na próxima tela você cria sua senha.' : 'Na próxima tela você digita sua senha.',
      email: st.email,
      on_email: this.on_email,
      temErro: !!st.erro,
      erro: st.erro,
      bordaEmail: st.erro ? '#FF7A7E' : '#3A414D',
      trocaTexto: criar ? 'Já tem conta?' : 'Não tem conta?',
      trocaAcao: criar ? 'Entrar' : 'Criar sua conta',
      google: this.google,
      comEmail: this.comEmail,
      criarConta: this.criarConta,
      voltar: this.voltar,
      trocarModo: this.trocarModo,
      continuar: this.continuar
    };
  }
}
</script>
</body>
</html>
